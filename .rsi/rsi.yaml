schema: hydra-rsi/1
# Committed bytes at HEAD of what the RepoYeti static site serves to visitors, and of index.html alone.
# Smaller downloads mean a faster landing page.
metrics:
  - id: site.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
  - id: site.html_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'html_bytes=(\d+)'
    gate: exact
    light: true
